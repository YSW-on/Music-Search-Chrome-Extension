<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Search</title>
    <link rel="stylesheet" href="popupstyle.css">
</head>
<body>
    <div id="wrapper1">
        <button id="searchBtn">Search</button>
        <div id="statusLog"></div>
        <div id="sign1">This extension is based on the <a href="https://audd.io" target="_blank">AudD API</a> and search results may not always be accurate.</div>
        <div id="sign2">Search results are shown for the US region instead of the region matching your browser language.</div>
    </div>
    <img id="albumArtDisplay" src="https://placeholder.com">
    <div id="wrapper2">
        <div id="titleDisplay"></div>
        <div id="artistDisplay"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
